[profile.default]
src = "."
out = "out"
libs = ["lib"]
solc_version = "0.8.24"

# Optimizer settings - optimize for deployment size (low runs = smaller bytecode)
# via_ir enabled to reduce deployment gas costs
optimizer = true
optimizer_runs = 200
via_ir = true

# EVM version - use cancun (matches network)
evm_version = "cancun"

# Remappings for OpenZeppelin
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/"
]

# Exclude files that require newer Solidity versions or aren't needed
ignored_error_codes = [5574]  # Ignore "contract code size" warnings
fs_permissions = [{ access = "read", path = "./"}]

# Exclude files requiring Solidity >= 0.8.26
ignored_file_paths = [
    "lib/openzeppelin-contracts/certora",
    "lib/openzeppelin-contracts/contracts/account",
    "lib/openzeppelin-contracts/contracts/mocks",
    "lib/openzeppelin-contracts/contracts/utils/RLP.sol",
    "lib/openzeppelin-contracts/contracts/utils/cryptography/signers",
    "lib/openzeppelin-contracts/contracts/utils/draft-InteroperableAddress.sol",
    "lib/openzeppelin-contracts/contracts/crosschain",
    "lib/openzeppelin-contracts/test"
]

[rpc_endpoints]
hyperliquid_mainnet = "https://rpc.hyperliquid.xyz/evm"
hyperliquid = "${HYPERLIQUID_RPC_URL}"

[etherscan]
hyperliquid = { key = "${HYPERLIQUID_API_KEY}" }


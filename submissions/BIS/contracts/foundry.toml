[profile.default]
src = "."
out = "out"
libs = ["lib"]
solc_version = "0.8.20"

# Optimizer settings
optimizer = true
optimizer_runs = 200

# EVM version
evm_version = "shanghai"

# Remappings for OpenZeppelin
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/"
]

[rpc_endpoints]
hyperliquid = "${HYPERLIQUID_RPC_URL}"

[etherscan]
hyperliquid = { key = "${HYPERLIQUID_API_KEY}" }

